# Render Blueprint: the playable prototype with online multiplayer (prototype/README.md, "Hosting it online").
# The free plan sleeps after 15 idle minutes; waking takes about a minute and starts an empty room.
services:
  - type: web
    name: forged-prototype
    runtime: docker
    plan: free
    dockerfilePath: ./prototype/Dockerfile
    dockerContext: ./prototype
    healthCheckPath: /
    autoDeployTrigger: commit # every push to the Blueprint's branch redeploys
